name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run unit tests
        run: |
          python -m pip install --quiet httpx==0.28.1 h2==4.2.0 certifi pytest
          python -m pytest -q tests

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost || true
          df -h /

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libtool-bin m4 \
            pkg-config cmake build-essential zlib1g-dev libncurses-dev libffi-dev \
            libssl-dev libltdl-dev

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec', 'p4a_hook.py') }}
          restore-keys: buildozer-

      - name: Install Buildozer
        run: python -m pip install --upgrade pip wheel setuptools buildozer==1.5.0 "cython==0.29.36"

      - name: Build APK
        run: buildozer -v android debug

      - name: Show result
        run: ls -la bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tg-ws-proxy-launcher-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
